databases:
  - name: smartrepair-lager-db
    plan: free
    databaseName: smartrepair_lager
    user: smartrepair_lager

services:
  - type: web
    name: smartrepair-lager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartrepair-lager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: ari@mohammadi.at
      - key: ADMIN_PASSWORD
        sync: false
